    /* ==========================================================================
       1. CSS VARIABLES (CUSTOMISE ALL COLOURS, SIZES, AND SPACING HERE)
       ========================================================================== */
    :root {
      /* Card Physical Dimensions (Standard ISO/IEC 7810 ID-1: 85.60 × 53.98 mm) */
      --card-width: 85.6mm;
      --card-height: 54mm;
      --card-radius: 3.18mm; /* Standard credit card corner radius */
      --card-padding: 3.8mm;

      /* Metallic Black Surface Gradients */
      --bg-metallic-base: #121316;
      --bg-metallic-glint: #23252a;
      --bg-metallic-deep: #090a0c;
      --card-rim-light: rgba(255, 255, 255, 0.16);
      --card-rim-gold: rgba(229, 193, 88, 0.35);

      /* Typography Colours */
      --text-white: #ffffff;
      --text-gold: #e5c158;
      --text-gold-light: #f5df97;
      --text-gray: #a6abb4;
      --text-gray-light: #d1d5db;
      --text-muted: #6b7280;

      /* Interactive & State Colours */
      --focus-outline-color: #f5df97;
      --disabled-icon-color: rgba(166, 171, 180, 0.3);

      /* Typography Sizing */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --name-font-size: 3.3mm;
      --title-font-size: 2.1mm;
      --org-font-size: 1.9mm;
      --label-font-size: 1.5mm;
      --value-font-size: 2.2mm;

      /* Avatar Dimensions */
      --avatar-size: 16mm;
      --avatar-radius: 2.2mm;

      /* Lighting and Shadows */
      --card-shadow-resting: 0 12px 32px -8px rgba(0, 0, 0, 0.75), 0 4px 12px -2px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       2. GLOBAL RESET & SCREEN LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      font-family: var(--font-family);
      background: radial-gradient(circle at 50% 30%, #1e2025 0%, #0d0e11 100%);
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ==========================================================================
       3. CARD CONTAINER & 3D PERSPECTIVE WRAPPER
       ========================================================================== */
    .card-scene {
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    /* The physical card element */
    .id-card {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      display: grid;
      grid-template-columns: 28mm 1fr;
      column-gap: 3.2mm;
      overflow: hidden;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;

      /* Realistic metallic finish: brushed sheen and reflections */
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.4) 100%),
        radial-gradient(ellipse at top left, var(--bg-metallic-glint) 0%, var(--bg-metallic-base) 55%, var(--bg-metallic-deep) 100%);
      box-shadow:
        var(--card-shadow-resting),
        inset 0 1px 0 0 var(--card-rim-light),
        inset 1px 0 0 0 rgba(255, 255, 255, 0.08),
        inset -1px -1px 0 0 var(--card-rim-gold),
        0 0 0 1px rgba(0, 0, 0, 0.9);

      /* Smooth transition when releasing cursor */
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Specular dynamic light sheen that follows mouse */
    .card-sheen {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(
        circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.12) 0%,
        rgba(245, 223, 151, 0.05) 30%,
        transparent 65%
      );
      mix-blend-mode: overlay;
      opacity: 0.85;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* Subtle hairline border simulation */
    .card-border-glint {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(229, 193, 88, 0.22);
      pointer-events: none;
      z-index: 11;
    }

    /* ==========================================================================
       4. LEFT COLUMN: AVATAR, FULL NAME, AND POSITION
       ========================================================================== */
    .col-profile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .avatar-wrapper {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: var(--avatar-radius);
      position: relative;
      background: linear-gradient(135deg, #2b2e36 0%, #15161a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(229, 193, 88, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Picture element */
    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* Fallback Initials (shown in a coloured circle when image fails or is unavailable) */
    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--avatar-size) - 2mm);
      height: calc(var(--avatar-size) - 2mm);
      border-radius: 50%;
      font-size: 5mm;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-gold);
      background: radial-gradient(circle at 35% 30%, #30333c 0%, #141518 100%);
      border: 1px solid rgba(229, 193, 88, 0.4);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15), 0 2px 4px rgba(0, 0, 0, 0.6);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 1;
    }

    .profile-details {
      margin-top: 2.2mm;
    }

    /* Full Name - Largest text on the card */
    .full-name {
      font-size: var(--name-font-size);
      font-weight: 800;
      line-height: 1.15;
      color: var(--text-white);
      text-transform: capitalize;
      letter-spacing: 0.15px;
      margin-bottom: 0.8mm;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* Title or Role */
    .role-title {
      font-size: var(--title-font-size);
      font-weight: 600;
      line-height: 1.2;
      color: var(--text-gold);
      text-transform: capitalize;
      letter-spacing: 0.1px;
    }

    /* Organisation */
    .organisation {

      line-height: 1.2;
      color: var(--text-gray-light);
      text-transform: capitalize;
      margin-top: 0.4mm;
    }

    /* ==========================================================================
       5. RIGHT COLUMN: CONTACT DETAILS & SOCIAL ICONS
       ========================================================================== */
    .col-contact {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      padding-left: 1mm;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 1.6mm;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
    }

    .contact-label {
      font-size: var(--label-font-size);
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-gold-light);
      opacity: 0.85;
      margin-bottom: 0.2mm;
    }

    .contact-value {
      font-size: var(--value-font-size);
      font-weight: 500;
      line-height: 1.15;
      color: var(--text-white);
      text-decoration: none;
      word-break: break-all;
      position: relative;
      display: inline-block;
      transition: color 0.15s ease;
    }

    /* Expand tap target for mobile without distorting physical card layout */
    .contact-link::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      min-height: 44px;
      min-width: 44px;
    }

    .contact-link:hover {
      color: var(--text-gold);
      text-decoration: underline;
    }

    /* Social accounts row */
    .social-row {
      display: flex;
      align-items: center;
      gap: 2.2mm;
      padding-top: 1mm;
      border-top: 1px solid rgba(255, 255, 255, 0.06);

    .social-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 5.5mm;
      height: 5.5mm;
      border-radius: 1mm;
      text-decoration: none;
      color: var(--text-white);
      transition: transform 0.15s ease, color 0.15s ease;
    }

    /* Expand tap targets to at least 44x44px for accessibility */
    .social-link::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 44px;
      min-height: 44px;
    }

    .social-icon-svg {
      width: 3.6mm;
      height: 3.6mm;
      fill: currentColor;
    }

    /* Active links highlight */
    .social-link:hover {
      color: var(--text-gold);
      transform: translateY(-1px);
    }

    /* Greyed-out, disabled accounts */
    .social-item.disabled {
      color: var(--disabled-icon-color);
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Accessible focus rings */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus-outline-color);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ==========================================================================
       6. ACTIONS / PRINT BUTTON AREA
       ========================================================================== */
    .controls-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .print-button {
      background: linear-gradient(180deg, #2c2f37 0%, #1a1c22 100%);
      color: var(--text-gold);
      border: 1px solid var(--text-gold);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 0.75rem 1.6rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      min-width: 44px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .print-button:hover {
      background: linear-gradient(180deg, #363a43 0%, #22252c 100%);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .print-button:active {
      transform: translateY(1px);
    }

    .print-btn-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ==========================================================================
       7. ACCESSIBILITY & REDUCED MOTION PREFERENCES
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .id-card {
        transform: none !important;
        transition: none !important;
      }
      .card-sheen {
        display: none !important;
      }
      .social-link:hover,
      .print-button:hover {
        transform: none !important;
      }
    }

    /* ==========================================================================
       8. PRINT MEDIA STYLING (EXACT 85.6mm x 54mm PHYSICAL OUTPUT)
       ========================================================================== */
    @media print {
      @page {
        size: 85.6mm 54mm;
        margin: 0;
      }

      html, body {
        width: 85.6mm;
        height: 54mm;
        margin: 0;
        padding: 0;
        background: #000 !important;
        display: block;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card-scene {
        margin: 0;
        padding: 0;
        perspective: none;
      }

      .id-card {
        width: 85.6mm;
        height: 54mm;
        border-radius: 0;
        box-shadow: none !important;
        transform: none !important;
        border: none;
        page-break-inside: avoid;
        page-break-after: avoid;
      }

      .card-sheen,
      .card-border-glint,
      .controls-area {
        display: none !important;
      }

      .contact-link::after,
      .social-link::after {
        display: none !important;
      }
    }
  </style>

  <script>
    (function () {
      'use strict';

      const card = document.getElementById('idCard');
      const sheen = document.getElementById('cardSheen');
      const printBtn = document.getElementById('printCardBtn');

      // Check user reduced motion preference
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      // Print card on button click
      if (printBtn) {
        printBtn.addEventListener('click', () => {
          window.print();
        });
      }

      // Check if image source is empty on load, fallback immediately to initials
      const profilePhoto = document.getElementById('profilePhoto');
      if (profilePhoto && (!profilePhoto.getAttribute('src') || profilePhoto.getAttribute('src').trim() === '')) {
        profilePhoto.style.display = 'none';
      }

      // Tilt physics configuration
      const MAX_TILT = 7.5; // Maximum degrees of tilt

      function handleMouseMove(event) {
        if (prefersReducedMotion.matches) return;

        const rect = card.getBoundingClientRect();
        const cardX = event.clientX - rect.left;
        const cardY = event.clientY - rect.top;

        // Calculate cursor position as a percentage (-1 to +1) from card center
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const deltaX = (cardX - centerX) / centerX;
        const deltaY = (cardY - centerY) / centerY;

        // Calculate rotation angles
        const rotateX = (-deltaY * MAX_TILT).toFixed(2);
        const rotateY = (deltaX * MAX_TILT).toFixed(2);

        // Calculate sheen highlight position
        const sheenPercentX = ((cardX / rect.width) * 100).toFixed(1);
        const sheenPercentY = ((cardY / rect.height) * 100).toFixed(1);

        // Apply 3D transform and sheen reflection
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
        card.style.boxShadow = `
          0 20px 40px -10px rgba(0, 0, 0, 0.85),
          0 8px 18px -4px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 0 var(--card-rim-light),
          inset 1px 0 0 0 rgba(255, 255, 255, 0.08),
          inset -1px -1px 0 0 var(--card-rim-gold),
          0 0 0 1px rgba(0, 0, 0, 0.9)
        `;

        card.style.setProperty('--mouse-x', `${sheenPercentX}%`);
        card.style.setProperty('--mouse-y', `${sheenPercentY}%`);
      }

      function handleMouseLeave() {
        if (prefersReducedMotion.matches) return;

        // Settle smoothly back to flat resting position
        card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0)';
        card.style.boxShadow = '';
        card.style.setProperty('--mouse-x', '50%');
        card.style.setProperty('--mouse-y', '50%');
      }

      // Attach mouse tracking listeners
      if (card) {
        card.addEventListener('mousemove', handleMouseMove);
        card.addEventListener('mouseleave', handleMouseLeave);
      }
    })();
  </script>
